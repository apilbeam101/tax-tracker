# Optional but recommended: ingress only from the ingress controller's namespace, egress only to
# DNS and HTTPS.
#
# Enforcement depends on the cluster's CNI implementing NetworkPolicy. Calico, Cilium and others
# do; kindnet (kind's default) does not, and applying this under a non-enforcing CNI looks
# identical to it working while isolating nothing. Check against your cluster.
#
# Adjust the ingress namespaceSelector to the namespace your ingress controller actually runs in
# (ingress-nginx below). Get it wrong and the app is unreachable through the ingress with no
# error pointing at the policy. This relies on the kubernetes.io/metadata.name label that
# Kubernetes 1.22+ sets on every namespace.
#
# Image pulls are done by the kubelet on the node, not by the pod, so this policy neither blocks
# nor needs a rule for them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tax-tracker
  namespace: tax-tracker
  labels:
    app.kubernetes.io/name: tax-tracker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tax-tracker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to the exchange-rate, price and dividend providers (HMRC's trade-tariff service,
    # Frankfurter, Tiingo, Yahoo Finance, Alpha Vantage). Their addresses change, so this cannot
    # be narrower than any destination on 443; narrow it if you only use some of them and your
    # CNI supports FQDN rules.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
