# OPTIONAL. The app already takes a daily backup of its own when BACKUP_SCHEDULE=daily (set in
# configmap.yaml). This runs `tax-tracker backup` on a schedule from outside the pod, which is
# useful if you want backups on a different schedule or to see failures as failed Jobs.
#
# It writes into the same backups/ folder as the in-app schedule, so both share the 14 most
# recent "manual" backups. A backup copies ciphertext and needs neither the passphrase nor the
# key, so it works while the data is locked. Backups stay on the same volume: copy them off the
# cluster (see docs/BACKUP_RESTORE.md) for protection against losing the volume itself.
#
# A ReadWriteOnce volume is attached to one node at a time, so the Job is pinned to the node the
# StatefulSet pod runs on (podAffinity below). If your storage only offers ReadWriteOncePod, no
# second pod can mount the volume and this Job cannot work; rely on the in-app schedule instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tax-tracker-backup
  namespace: tax-tracker
  labels:
    app.kubernetes.io/name: tax-tracker-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tax-tracker-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: tax-tracker
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/apilbeam101/tax-tracker:0.1
              imagePullPolicy: IfNotPresent
              # The image's entrypoint is the tax-tracker command; DATA_DIR is /app/data.
              args: ["backup"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                # The claim the StatefulSet created: <template name>-<statefulset name>-<ordinal>.
                claimName: data-tax-tracker-0
            - name: tmp
              emptyDir:
                sizeLimit: 128Mi
