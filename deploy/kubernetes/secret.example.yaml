# TEMPLATE ONLY, with placeholder values. Copy to secret.yaml, fill in real values and apply that
# copy. Never commit a populated Secret.
#
# base64 in a Secret is encoding, not encryption, and the values sit in etcd. Protect them with
# etcd encryption at rest (the cluster operator's job) and consider keeping the encrypted artefact
# in Git instead of applying this by hand: External Secrets Operator, Sealed Secrets, SOPS or your
# cloud provider's CSI secret driver.
#
# The Secret is mounted as files (not environment variables) so the values do not show up in
# `kubectl describe pod`, process environments or crash dumps. The keys below become the file
# names that the *_FILE settings in configmap.yaml point at.
#
# Generate each value with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
apiVersion: v1
kind: Secret
metadata:
  name: tax-tracker-secrets
  namespace: tax-tracker
  labels:
    app.kubernetes.io/name: tax-tracker
type: Opaque
stringData:
  # Required. At least 32 characters; the app refuses a placeholder or a short value.
  session-secret: "REPLACE_ME"

  # Optional, each also needs its *_FILE line uncommented in configmap.yaml:
  # tiingo-api-key: "REPLACE_ME"
  # alpha-vantage-api-key: "REPLACE_ME"
  # encryption-key: "REPLACE_ME"
