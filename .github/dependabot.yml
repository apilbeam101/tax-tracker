version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs specifically so a compromised tag
  # can't silently change what a workflow runs -- this is what keeps those
  # pins current without hand-tracking upstream releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
