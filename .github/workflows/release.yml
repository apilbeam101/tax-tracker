name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

# Two tags pushed together must not race for :latest and the npm dist-tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Re-verify tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run changelog:check

      - name: assert tag matches package.json version
        id: version
        run: |
          set -eu
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          case "$tag_version" in
            *-*) echo "is-prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "is-prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: assert CHANGELOG.md has a matching release section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node --experimental-strip-types scripts/extract-changelog-section.ts "$VERSION" > /dev/null

  publish:
    name: Build, push, and attest image
    needs: verify
    uses: ./.github/workflows/_publish-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.verify.outputs.version }}
      tag-latest: ${{ needs.verify.outputs.is-prerelease != 'true' }}
    secrets: inherit

  # npm trusted publishing: the registry accepts the workflow's OIDC identity, so no long-lived
  # token is stored. Needs the trusted publisher to be configured for this repository and workflow
  # on npmjs.com, and the repository variable NPM_PUBLISH_ENABLED=true.
  npm-publish:
    name: Publish to npm
    needs: [verify, publish]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # npm's trusted-publishing guidance: never use caching in release builds.
          package-manager-cache: false

      - name: assert npm supports trusted publishing
        run: |
          set -eu
          v=$(npm --version)
          echo "npm $v"
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $v is older than 11.5.1, which is the first version that can publish with OIDC" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run pack:check
      # A pre-release goes to the "next" dist-tag, so it never becomes what `npm install` picks.
      - run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NPM_TAG: ${{ needs.verify.outputs.is-prerelease == 'true' && 'next' || 'latest' }}

  github-release:
    name: Create GitHub Release
    needs: [verify, publish, npm-publish]
    # npm-publish is skipped when publishing is not enabled and may fail; the release is still
    # created then, but without the installers, which install the version from npm.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node --experimental-strip-types scripts/extract-changelog-section.ts "$VERSION" > release-notes.md

      # The installers are attached with this release's version written in, so a pinned download
      # URL always installs the version it belongs to. They install from npm, so they are only
      # attached once that version has been published there.
      - name: stamp and checksum the installers
        if: needs.npm-publish.result == 'success'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: node --experimental-strip-types scripts/stamp-installers.ts "$VERSION" release-assets

      # A checksum file next to the scripts proves nothing about where they came from; the
      # attestation does (gh attestation verify install.sh --repo <owner>/<repo>).
      - name: attest the installers
        if: needs.npm-publish.result == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.is-prerelease == 'true' }}
          files: release-assets/*
