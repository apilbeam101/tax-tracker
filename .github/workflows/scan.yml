name: Image vulnerability scan

# Two entry points:
# - Called by rebuild.yml right after it publishes, with the digest it pushed, so the post-rebuild
#   scan always covers the rebuilt image. Two independent crons never guaranteed that ordering,
#   because GitHub delays scheduled runs by hours.
# - Its own mid-month schedule against :latest. This is the backstop for a rebuild that silently
#   stopped (scheduled workflows are auto-disabled after 60 days without repository activity): a
#   disabled rebuild never calls this workflow, so only this run can surface the stale image.
on:
  workflow_call:
    inputs:
      image-ref:
        description: Image reference to scan, ideally pinned by digest
        required: true
        type: string
  schedule:
    - cron: "0 8 15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Trivy scan of published image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: check whether a release has ever been published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -eu
          if [ -n "$IMAGE_REF" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "no release has been published yet: nothing to scan"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.exists == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve image ref
        id: image
        if: steps.release.outputs.exists == 'true'
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          set -eu
          ref="${IMAGE_REF:-ghcr.io/${GITHUB_REPOSITORY,,}:latest}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # A release exists, so this image must exist too. No `continue-on-error` here: a scan that
      # silently reports green because it scanned nothing is worse than no scan.
      # ignore-unfixed: a finding with no fixed package cannot be resolved by a rebuild or a
      # release, so counting it only grows the alert list without anything to act on.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: steps.release.outputs.exists == 'true'
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # Under workflow_call the default category derives from the caller's workflow, which would
      # split alerts across two categories so neither closes the other's stale ones.
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: steps.release.outputs.exists == 'true'
        with:
          sarif_file: trivy-results.sarif
          category: .github/workflows/scan.yml:scan
