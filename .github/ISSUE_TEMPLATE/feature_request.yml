name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not paste real financial data; use made-up figures if you need an example.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or the problem first, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: checkboxes
    id: no-real-data
    attributes:
      label: Before you submit
      options:
        - label: This request contains no real financial data, passphrases, recovery keys, secrets or API keys.
          required: true
